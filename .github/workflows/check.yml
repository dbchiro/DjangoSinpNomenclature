# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: "🌈 Code quality"

on:
  push:
    # branches: [ $default-branch ]
    branches: [$default-branch, "dev"]
  pull_request:
    branches: [$default-branch, "dev"]

jobs:
  check-syntax-lints-type:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      #-----------------------------------------------
      #  -----  checkout repo and set-up python  -----
      #-----------------------------------------------
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run image
        uses: abatilo/actions-poetry@v4
      #------------------------------------
      #  -----  Install dependencies  -----
      #------------------------------------
      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y libgraphviz-dev
          poetry install --with=dev
      - name: Lint with Ruff
        run: poetry run ruff check sinp_nomenclatures config

      - name: Format check with Ruff
        run: poetry run ruff format --check sinp_nomenclatures config
      #-----------------------------
      #--------  run build  ---------
      #-----------------------------
      - name: Test build
        run: poetry build
